<body>

    <a href="#main-content" class="skip-link">
        Skip to main content
    </a>

    <header class="site-header">

        <a href="index.html" class="logo">Hemalatha.</a>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>

    </header>

    <main id="main-content">

        <section aria-labelledby="page-heading">

            <h1 id="page-heading">Get in Touch</h1>

            <p>
                Have an opportunity or collaboration in mind?
                Feel free to contact me.
            </p>

        </section>

        <section aria-labelledby="contact-form-heading">

            <h2 id="contact-form-heading">Send Me a Message</h2>

            
<form id="contact-form" novalidate>

    <div>
        <label for="name">Full Name</label>

        <input
            type="text"
            id="name"
            name="name"
            autocomplete="name"
            aria-describedby="name-error"
            required
        >

        <span id="name-error" class="form-error"></span>
    </div>

    <div>
        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            aria-describedby="email-error"
            required
        >

        <span id="email-error" class="form-error"></span>
    </div>

    <div>
        <label for="subject">Subject</label>

        <input
            type="text"
            id="subject"
            name="subject"
            aria-describedby="subject-error"
            required
        >

        <span id="subject-error" class="form-error"></span>
    </div>

    <div>
        <label for="message">Your Message</label>

        <textarea
            id="message"
            name="message"
            rows="6"
            aria-describedby="message-error"
            required
        ></textarea>

        <span id="message-error" class="form-error"></span>
    </div>

    <p
        id="form-status"
        role="status"
        aria-live="polite"
        aria-atomic="true"
    ></p>

    <button type="submit">
        Send Message
    </button>

</form>


        </section>

    </main>

    <footer class="site-footer">

    </footer>

</body>
